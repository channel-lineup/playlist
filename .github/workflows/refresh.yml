name: Refresh playlist

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rapidfuzz
      - run: python build.py
        env:
          ALERT_RULES: ${{ secrets.ALERT_RULES }}
      - name: Commit if changed
        run: |
          git config user.name "playlist-bot"
          git config user.email "actions@users.noreply.github.com"
          git add combined-tv.m3u epg.xml.gz epg-sources.txt
          git diff --cached --quiet || git commit -m "Playlist and guide refresh"
          git pull --rebase
          git push
